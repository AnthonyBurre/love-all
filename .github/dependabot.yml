# Weekly update PRs for the locked Python dependencies and the workflow actions. The actions
# are pinned to commit SHAs, and Dependabot moves the SHA and its version comment together.
# Security fixes open their own PRs as soon as an advisory is published, outside the schedule.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
