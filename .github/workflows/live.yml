name: Deploy live brackets

# Fast path: fetch current brackets/scores from ESPN, reuse the last insights DB (from the
# Release), and deploy docs/ to Pages. No heavy DB rebuild — runs cheaply on a schedule.
on:
  workflow_dispatch:
  schedule:
    - cron: "5 * * * *"         # hourly at :05

permissions:
  contents: write             # persist the accumulating draw-history asset on the Release
  pages: write
  id-token: write

# Queue rather than cancel: a run cut off mid-way through its Release uploads or its Pages
# deploy leaves the job half-done, and the next run is at most an hour behind anyway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      # The version we ship on lives in .python-version
      - id: py
        run: echo "version=$(cat .python-version)" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ steps.py.outputs.version }}

      # No test step: ci.yml gates every push and branch protection requires it on main, which
      # is the only branch the schedule runs, so an hourly re-run would test the same commit.
      - name: Install dependencies
        run: uv sync

      - name: Fetch latest insights.duckdb (from the Release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data
          if gh release download insights-latest --pattern insights.duckdb --dir data --clobber; then
            echo "downloaded: $(ls -l data/insights.duckdb)"
          else
            echo "no insights release yet — brackets will render without player insights"
          fi
          # The per-match sidecars ride on the same release. Absent, every charted match
          # simply falls back to the career panel, so this is not fatal.
          if gh release download insights-latest --pattern match_details.tar.gz --dir data --clobber; then
            tar -xzf data/match_details.tar.gz -C data
            echo "match details: $(ls data/match_details | wc -l) charted matches"
          else
            echo "no match-detail sidecars yet — charted matches show the career panel"
          fi

      - name: Fetch accumulated draw history (from the Release)
        id: history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rc=0
          .github/scripts/history-archive.sh fetch || rc=$?
          case $rc in
            0) echo "seed_needed=false" >> "$GITHUB_OUTPUT" ;;
            3) echo "will seed the most recent finished slam once"
               echo "seed_needed=true" >> "$GITHUB_OUTPUT" ;;
            *) exit 1 ;;
          esac

      # Runs at most once, ever: on the first deploy (before the history Release exists) it
      # archives the most recent finished slam so the site opens with a past draw. Every run
      # after finds the Release and skips this, so ESPN's dated feed isn't hit repeatedly.
      # A failed download fails the step above rather than landing here, since a seeded
      # archive would replace the real one on upload.
      - name: Seed the first past draw (one-time)
        if: ${{ steps.history.outputs.seed_needed == 'true' }}
        run: uv run match-charting-project history seed

      # The Wikipedia-sourced feeds: the tour calendar (which events exist, at what level,
      # and where each one's draw page lives) and the draw sheets themselves (slot order,
      # seeds, byes). Plus the last ESPN scoreboards, which let an off-week run skip the
      # request and give a failed fetch something to fall back to. All caches, not committed
      # data, and all safe to lose: a missing one is simply fetched again.
      - name: Fetch feed caches (from the Release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/live
          gh release download feeds-cache --pattern calendar.json --dir data --clobber || true
          gh release download feeds-cache --pattern draws.json --dir data --clobber || true
          gh release download feeds-cache --pattern '*_scoreboard.json' --dir data/live \
            --clobber || true

      # Also refreshes the tour calendar once it is a day old, and fetches any newly published
      # draw sheet (see feeds.CALENDAR_MAX_AGE). Both degrade to their caches on failure and
      # warn on stderr, so a Wikipedia outage can't block the deploy.
      - name: Build brackets + assemble docs/data
        run: |
          uv run match-charting-project site build-brackets
          echo "--- docs/data contents ---" && ls -la docs/data/

      # Merges into the archive as it stands now, so a backfill that landed during this run
      # is kept rather than overwritten.
      - name: Persist updated draw history (to the Release)
        if: ${{ hashFiles('data/history.json') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/history-archive.sh persist

      - name: Persist feed caches (to the Release)
        if: ${{ hashFiles('data/calendar.json', 'data/draws.json', 'data/live/*_scoreboard.json') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create feeds-cache --title "Feed caches" \
            --notes "Tour calendar and draw sheets from Wikipedia, last ESPN scoreboards" \
            2>/dev/null || true
          for f in data/calendar.json data/draws.json data/live/*_scoreboard.json; do
            if [ -f "$f" ]; then
              gh release upload feeds-cache "$f" --clobber
            fi
          done

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - id: deploy
        uses: actions/deploy-pages@v5
