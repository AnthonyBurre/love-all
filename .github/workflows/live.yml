name: Deploy live brackets

# Fast path: fetch current brackets/scores from ESPN, reuse the last insights DB (from the
# Release), and deploy docs/ to Pages. No heavy DB rebuild — runs cheaply on a schedule.
on:
  workflow_dispatch:
  schedule:
    - cron: "5 * * * *"         # hourly at :05

permissions:
  contents: write             # persist the accumulating draw-history asset on the Release
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (core + dev for the test gate)
        run: uv sync --extra dev

      - name: Test gate (unit suite; DB-integration tests self-skip)
        run: uv run pytest -q

      - name: Fetch latest insights.duckdb (from the Release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data
          if gh release download insights-latest --pattern insights.duckdb --dir data --clobber; then
            echo "downloaded: $(ls -l data/insights.duckdb)"
          else
            echo "no insights release yet — brackets will render without player insights"
          fi

      - name: Fetch accumulated draw history (from the Release)
        id: history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data
          if gh release download brackets-history --pattern history.json --dir data --clobber; then
            echo "history: $(ls -l data/history.json)"
            echo "seed_needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "no history release yet — will seed the most recent finished slam once"
            echo "seed_needed=true" >> "$GITHUB_OUTPUT"
          fi

      # Runs at most once, ever: on the first deploy (before the history Release exists) it
      # archives the most recent finished slam so the site opens with a past draw. Every run
      # after finds the Release and skips this, so ESPN's dated feed isn't hit repeatedly.
      - name: Seed the first past draw (one-time)
        if: ${{ steps.history.outputs.seed_needed == 'true' }}
        run: uv run match-charting-project history seed

      # The Wikipedia-sourced feeds: the tour calendar (which events exist, at what level,
      # and where each one's draw page lives) and the draw sheets themselves (slot order,
      # seeds, byes). Both are caches, not committed data.
      - name: Fetch feed caches (from the Release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data
          gh release download feeds-cache --pattern calendar.json --dir data --clobber || true
          gh release download feeds-cache --pattern draws.json --dir data --clobber || true

      # Without the calendar the site can't tell a 500 from a 250 and serves only slams and
      # 1000s. It also carries the per-event draw-page links, which a season page grows all
      # year as each draw is made — so this is an age check, not the season check it used to
      # be: that one pinned a July cache until January and left every event drawn after it
      # with no draw sheet. --if-stale no-ops while the cache is under a day old, keeping the
      # hourly run at two Wikipedia calls a day (an adopted draw sheet is never re-fetched).
      - name: Refresh the tour calendar (daily)
        run: uv run match-charting-project feeds calendar --if-stale

      - name: Build brackets + assemble docs/data
        run: |
          uv run match-charting-project site build-brackets
          echo "--- docs/data contents ---" && ls -la docs/data/

      - name: Persist updated draw history (to the Release)
        if: ${{ hashFiles('data/history.json') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create brackets-history --title "Draw history" \
            --notes "Completed draws, accumulated as events finish" 2>/dev/null || true
          gh release upload brackets-history data/history.json --clobber

      - name: Persist feed caches (to the Release)
        if: ${{ hashFiles('data/calendar.json', 'data/draws.json') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create feeds-cache --title "Feed caches" \
            --notes "Tour calendar and draw sheets, read from Wikipedia" 2>/dev/null || true
          for f in calendar.json draws.json; do
            [ -f "data/$f" ] && gh release upload feeds-cache "data/$f" --clobber
          done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deploy
        uses: actions/deploy-pages@v4
