name: Backfill past draws

# Manual, run-when-you-need-it: pull a finished slam out of ESPN's *dated* feed and add it
# to the archive the site reads. This is the only way to reach an event that finished before
# the site was watching — `live.yml` catches every event from its final onwards, and the
# one-time seed in that workflow only ever takes a single slam (the most recent finished one)
# and then never runs again.
#
# Cost: harvesting walks a generous per-slam window a day at a time, over both tours — about
# 70 requests for the Australian Open, 50 for Roland Garros. That is fine for a job run by
# hand and is why it is not on a schedule.
#
# It does not deploy. The hourly `live.yml` reads this same Release asset, so a backfill
# reaches the site on the next run — within the hour, without two workflows contending for
# the Pages deployment.
on:
  workflow_dispatch:
    inputs:
      events:
        description: 'Comma-separated "event:year" pairs (the four slams are supported)'
        required: true

permissions:
  contents: write             # the archive lives on the brackets-history Release

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The version we ship on lives in .python-version
      - id: py
        run: echo "version=$(cat .python-version)" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ steps.py.outputs.version }}

      - name: Install dependencies
        run: uv sync

      # Start from whatever the archive currently holds, so the harvested draws are folded
      # into it (replacing any older copy of the same draw) rather than into an empty file.
      - name: Fetch the current archive (from the Release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/history-archive.sh fetch || [ $? -eq 3 ]

      # The input arrives through the environment rather than `${{ }}` in the script, so the
      # shell reads it as data and a quote or `$(...)` in it can't become a command.
      - name: Harvest each requested draw
        env:
          EVENTS: ${{ inputs.events }}
        run: |
          IFS=',' read -ra PAIRS <<< "$EVENTS"
          for pair in "${PAIRS[@]}"; do
            event="${pair%:*}"; year="${pair##*:}"
            event="$(echo "$event" | xargs)"; year="$(echo "$year" | xargs)"
            echo "::group::$event $year"
            uv run match-charting-project history harvest --event "$event" --year "$year"
            echo "::endgroup::"
          done

      # The hourly deploy rewrites this same asset, and a harvest takes minutes. Persisting
      # re-reads the Release and merges into it, so an upload that landed while we worked is
      # kept rather than overwritten.
      - name: Persist the archive (to the Release)
        if: ${{ hashFiles('data/history.json') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/history-archive.sh persist
