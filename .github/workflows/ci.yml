name: CI

# Test gate for the library + experiments. The DB-integration tests skip themselves
# when no tennis.duckdb is present, so this runs the pure-unit suite — fast and
# data-free.
#
# The matrix covers two versions that mean different things:
#   .python-version  — the one we ship on: dev, live.yml and insights.yml all read it.
#   3.11             — the floor `requires-python` advertises.
#
# Runs on every branch push (no PR needed): the workflow is branch → push → green
# check → merge to main. Branch protection on main requires these checks, so this
# is the promotion gate. No pull_request trigger — same-repo PRs would run twice.
on:
  push:
    branches: ["**"]

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      shipped: ${{ steps.py.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: py
        run: echo "version=$(cat .python-version)" >> "$GITHUB_OUTPUT"

  test:
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "${{ needs.version.outputs.shipped }}"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint (ruff)
        run: uv run ruff check src tests experiments

      - name: Test
        run: uv run pytest -q
