name: CI

# Test gate for the library + experiments. The DB-integration tests skip themselves
# when no tennis.duckdb is present, so this runs the pure-unit suite — fast and
# data-free.
#
# The matrix covers two versions that mean different things:
#   .python-version  — the one we ship on: dev, live.yml and insights.yml all read it.
#   3.11             — the floor `requires-python` advertises.
#
# Runs on every branch push (no PR needed): the workflow is branch → push → green
# check → merge to main. Branch protection on main requires these checks, so this
# is the promotion gate. No pull_request trigger — same-repo PRs would run twice.
on:
  push:
    branches: ["**"]

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      shipped: ${{ steps.py.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: py
        run: echo "version=$(cat .python-version)" >> "$GITHUB_OUTPUT"

  test:
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "${{ needs.version.outputs.shipped }}"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint (ruff)
        run: uv run ruff check src tests experiments

      # Coverage is reported, never gated. The DB-integration tests skip here, so any
      # threshold would be measuring how much of the suite CI declined to run.
      - name: Test
        run: uv run pytest -q --cov=match_charting_project --cov-report=term-missing

  # The site's browser modules. Separate from the Python job because it needs a different
  # runtime and nothing else; there is no build step and no dependencies to install, since
  # the site ships docs/js as-is and the tests run on Node's built-in runner.
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      # TZ is pinned so the reader's timezone is a constant: schedule.js converts ESPN's
      # UTC start into local time, and the expected strings depend on what "local" is.
      - name: Test
        run: npm test
