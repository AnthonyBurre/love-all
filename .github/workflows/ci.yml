name: CI

# Test gate for the library + experiments. The DB-integration tests skip themselves
# when no tennis.duckdb is present, so this runs the pure-unit suite — fast and
# data-free. Matrix covers the supported floor (3.11) and the local dev version (3.14).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint (ruff)
        run: uv run ruff check src tests experiments

      - name: Test
        run: uv run pytest -q
